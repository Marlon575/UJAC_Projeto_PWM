<!DOCTYPE html>
<html>
<head>
    <title>Minha Primeira Página</title>
    <meta charset="UTF-8">
</head>

<body>

<h1>Bem-vindo à minha página</h1>
<p>Este é um exemplo de página HTML com tabela e formulário.</p>

<h2>Tabela de Estudantes</h2>

<table border="1">
<tr>
<th>Nome</th>
<th>Idade</th>
<th>Curso</th>
</tr>

<tr>
<td>Vidal</td>
<td>20</td>
<td>Engenharia Informática</td>
</tr>

<tr>
<td>Maria</td>
<td>22</td>
<td>Redes de Computadores</td>
</tr>

<tr>
<td>João</td>
<td>21</td>
<td>Programação</td>
</tr>

</table>

<h2>Formulário de Contato</h2>

<form>

<label>Nome:</label><br>
<input type="text" name="nome"><br><br>

<label>Email:</label><br>
<input type="email" name="email"><br><br>

<label>Mensagem:</label><br>
<textarea rows="4" cols="40"></textarea><br><br>

<button type="submit">Enviar</button>
<button type="reset">Limpar</button>

</form>

</body>
</html>
