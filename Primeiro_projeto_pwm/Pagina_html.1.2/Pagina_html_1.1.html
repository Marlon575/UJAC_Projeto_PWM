<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="estilo.css">
    </head>

    <body>
        <h2>Formulario de inscrição - Universidade Marlon Baptista Muchanga</h2>

        <form class="caixa">
            <label>Nome Completo:</label><br>
            <input type="text"placeholder="Digite o seu nome completo"><br><br>

            <label>Idade:</label><br>
            <input type="number" placeholder="Digite a sua idade"><br><br>

            <label>Data de Nascimento:</label><br>
            <input type="date"><br><br>

            <label>Email:</label><br>
            <input type="email" placeholder="Digite  o seu email"><br><br>

            <label>Escolha o Curso que deseja seguir:</label><br>
            <select>
                <option>-- Escolha um curso--</option>
                <option>Engenharia informática</option>
                <option>Contabilidade e Auditoria</option>
                <option>Inteligencia Artificial e Ciencia de dados</option>
                <option>Ciencia da Educação</option>
            </select><br><br>
            <label>Questionário de Seleção</label><br><br>
            <table>
                <tr>
                    <th>#</th>
                        <th>Pergunta</th>
                        <th>Opcões</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td> Já teve experiência com computadores?</td>
                    <td>
                        <label class="opcao">
                            <input type="radio" name="=q1" value="sim">Sim
                        </label>
                        <label class="opcao">
                            <input type="radio" name="q1" value="nao">Não
                        </label>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Qual é o teu nível de conhecimento?</td>
                    <td>
                        <label class="opcao"><input type ="radio" name="q2" value="basico">Básico</label>
                        <label class="opcao"><input type="radio" name="q2" value="medio"> Médio</label>
                        <label class="opcao"><input type="radio" name="q2" value="avancado"> Avançado</label>
                    </td>
                    </tr>
            </table>
            <button type="submit">Enviar</button>
        </form>

    </body>
</html>
