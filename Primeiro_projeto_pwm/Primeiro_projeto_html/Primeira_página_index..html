<!DOCTYPE html>
<html></html>
<head>
    <style>
        body {
            background-color: rgb(92, 205, 243);
            color:rgb(1, 1, 12);
            font-family: Arial, sans-serif;
        }
    </style>

<h2>Formulario de inscrição - Universidade Marlon Baptista Muchanga  </h2>

<form>
    <label> Nome Completo:</label><br>
    <input type="text" placeholder=" Digite a seu nome Completo"><br><br>
    
    <label>Idade:</label><br>
    <input type="number" placeholder=" Digite a sua idade atual"><br><br>
    
    <label>Data de Nascimento:</label><br>
    <input type="date" placeholder="Digite a sua data de nascimento"><br><br>

    <label>Enviei o seu certificado:</label><br>
    <input type="file" placeholder="Envei o seu certificado"><br><br>

    <label>Local de resedencia:</label><br>
    <input type="text" placeholder="Digite o seu local de resedencia"><br><br>
    
    <label>Email:</label><br>
    <input type="email" placeholder="Digite o seu email"><br><br>


    <label>Escolha o Curso que deseja seguir:</label><br>
    <select>
        <option>-- Escolha um curso --</option>
        <option> Engenharia Informática</option>
        <option>Contabilidade e Auditoria</option>
        <option>Inteligencia Artificial e Ciencia de dados</option>
        <option>Gestão Financeira e Bancária</option>
        <option>Ciencia da Educação</option>
    </select><br><br>
    
    
    </form>
    <br>
    <table border="1" cellpadding="8" cellspacing="0">
        <caption><strong> Questionário de Seleção</strong></caption>
        <tr>
            <th>#</th>
            <ht>Pergunta</ht>
            <th>Opções</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Já teve experiencia com computador</td>
            <td>
                <label><input type="radio" name="q1"  value="sim">Sim</label><br>
                <label><input type="radio" name="q1"  value="nao">Não</label>
            </td>
        </tr>
        <tr>
            <td>2</td>
            <td> Qual é o teu nível de conhecemento sobre Informática</td>
            <td>
                <label><input type="radio" name="q2" value="basico"> Conhecemento Basico</label><br>
                <label><input type="radio" name="q2" value="medio"> Conhecemento Médio</label><br>
                 <label><input type="radio" name="q2" value="avançado"> Conhecemento avançado</label>
            </td>
        </tr>
    </table>
    
    <h3>Motivações:</h3>
    <textarea rows="5" cols="50" placeholder="Escreve as suas motivações"></textarea>
    <button type="submit" style="background-color: rgb(0, 0, 123);color: rgb(255, 255, 255); padding: 10px 20px;">
        Enviar
    </button>
</body>
</html>
